# Windows 실행 파일에 C 런타임을 정적으로 넣는다(herdr 0.9.5 `.cargo/config.toml`과 같다): Windows agent 머신에
# VC++ 재배포 패키지(VCRUNTIME140.dll)가 없어도 `aaa.exe` 하나로 돈다(단일 실행 파일 배포)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# 공식 Linux release는 musl이다. DWARF를 버리지 않고 링크할 때 zlib로 압축한다.
# backtrace의 gimli/miniz reader와 debugger가 그대로 읽으며 실행 코드·unwind·함수 심볼은 유지한다.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-Wl,--compress-debug-sections=zlib"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-Wl,--compress-debug-sections=zlib"]
