[package]
name = "aaa-host"
description = "aaa host backend: 머신·pane 상태, lease·layout, Front API, 웹 서버, Tailscale 공개, SQLite. agent·session은 Agent link로만 다룬다"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aaa-proto.workspace = true
aaa-config.workspace = true
aaa-common.workspace = true
aaa-vt.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64.workspace = true
ring.workspace = true
sha2.workspace = true
toml_edit.workspace = true
toml.workspace = true
futures-util.workspace = true
hex.workspace = true
rand.workspace = true
tracing.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
# Retry-After의 HTTP 날짜(구독 사용량 429). hyper가 이미 쓰는 판이다
httpdate = "1"
# `pane wait-output --regex`(Cargo.lock에 이미 있는 판)
regex = "1"
axum = { version = "0.8", features = ["ws"] }

[dev-dependencies]
# router를 그대로 부르는 입구 시험(`ServiceExt::oneshot`). axum이 이미 쓰는 판·기능이다
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
