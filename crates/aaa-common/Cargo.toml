[package]
name = "aaa-common"
description = "aaa 역할들이 함께 쓰는 바탕: 로컬 IPC·frame 연결·TLS 신원·OS 유틸·Front API 클라이언트(같은 머신)·PR 주소 해석. 역할 crate에 의존하지 않는다"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aaa-proto.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ulid.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
ring.workspace = true
tracing.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
futures-util.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
backtrace = "0.3"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
zstd = { version = "0.13.3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_Pipes",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
aaa-test-support.workspace = true
portable-pty.workspace = true
