[package]
name = "aaa-common"
description = "aaa 역할들이 함께 쓰는 바탕: 로컬 IPC·frame 연결·TLS 신원·OS 유틸·Front API 클라이언트·PR 주소 해석. 역할 crate에 의존하지 않는다"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aaa-proto.workspace = true
anyhow.workspace = true
thiserror.workspace = true
