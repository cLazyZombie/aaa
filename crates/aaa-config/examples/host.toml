# aaa host backend 설정. 위치: macOS ~/.config/aaa/host.toml (AAA_CONFIG_DIR로 바꿀 수 있다)
# 머신별 값은 같은 폴더의 host.local.toml에 두면 덮어쓴다.
schema = 1

# DB 전체를 압축·age 암호화해 하루 한 번 보관한다. 설정·복원: docs/host-db-backup.md
[backup]
enabled = false
directory = ""
recipient = ""
daily_utc = "19:45"
keep = 7

[host]
# Agent link(TCP+TLS 1.3) listen 주소. 원격 agent가 여기로 연결한다. 빈 문자열이면 원격을 받지 않는다.
agent_listen = "0.0.0.0:7430"
# host→agent 요청 상한(초, 1~86400). 생략하면 준비·정리 10분, 보고 목록·파일 읽기 2분.
# 준비의 fetch·checkout과 정리의 worktree remove에도 이 상한을 전달한다. 다른 짧은 요청은 15초다.
thread_prepare_timeout_secs = 600
thread_cleanup_timeout_secs = 600
file_request_timeout_secs = 120
# 웹 「SSH로 머신 추가」가 ssh -F로 줄 설정 파일(비우면 ~/.ssh/config). host는 이미 있는 키·ssh-agent·설정만 쓴다
ssh_config = ""


[web]
# host 웹은 loopback에서만 연다. 다른 기기에는 `aaa web publish`(tailscale serve HTTPS)로 연다.
listen = "127.0.0.1:7431"
# publish 후보 HTTPS 포트. serve status에서 이미 쓰는 포트는 건너뛴다.
publish_ports = [443, 8443, 7443, 17443]

[local_agent]
# child: 개발 모드(host가 로컬 agent를 띄움), launchd: 운영 모드(LaunchAgent가 띄움), none: 쓰지 않음
mode = "child"

[terminal]
# 새 탭·나누기 pane의 폴더: "follow"(원래 pane이 지금 있는 폴더, 같은 머신일 때), "home", 또는 절대 경로
new_cwd = "follow"

[post]
# 일반 post의 출처별 기본 한도. 짧은 측정 핑퐁과 장시간 작업을 허용한다.
burst = 30
burst_secs = 60
hourly = 200
daily = 2000
# 목적지 쌍별 한도 예약값(현재 thread→coordinator 경로에는 적용하지 않는다)
pair_hourly = 100
# 한 시간 안 rate 거부가 이 횟수에 닿으면 자동 음소거한다. 같은 글은 24시간 중복 거부한다.
mute_after = 20
# 검증된 coordinator→user 알림은 별도 고정 한도(분당 30·시간당 60·하루 300), 자동 음소거 없음.

[projects]
# 프로젝트 폴더 root(비우면 ~/.aaa/projects)
root = ""
# thread에 쓸 수 있는 profile(옛 자리, "*"는 모두). [safety.*] thread_profiles가 있으면 그것이 먼저다.
allow_profiles = ["*"]
# 보고와 함께 host로 복사할 library 상한(MB). 넘는 파일은 agent에 남는다.
library_copy_mb = 200
# host 보고서 사본의 최대 기한(일)·합계 상한(MiB). 각각 0 또는 ""이면 끈다. 생략하면 기본값.
# 진행 중 thread는 보호하며 실시간 등록 폴더는 합계·정리 대상에서 제외한다.
library_max_days = 30
library_max_mb = 20480 # 20GiB
# brief에 넣을 memory 글자 수 상한
brief_memory_chars = 32000
# ticker 주기(초). inbox 항목이 생기거나 harness가 입력 대기가 되면 주기를 기다리지 않고 돈다.
tick_secs = 15
# coordinator가 이만큼(초) 입력 대기 상태로 머물러야 inbox 알림(nudge)을 보낸다
nudge_idle_secs = 60
# coordinator 입력창이 이만큼(초) 비어 있어야 nudge를 보낸다(사람이 치는 글과 섞이지 않게)
nudge_quiet_secs = 10
# 머신이 이만큼(초) 끊겨 있으면 inbox에 outage 항목을 만든다(`gh`가 이만큼 계속 실패해도 한 번 알린다)
outage_secs = 600
# brief 안내·메시지를 친 때부터 harness가 받았다고 알리기까지 기다리는 시간(밀리초). 입력 상자를 그리는 harness는 이 안에서
# 친 글이 보이기를 기다려 Enter한다. 넘으면 전달 불명(다시 보내지 않는다)
accept_wait_ms = 10000
# interrupt 메시지: Esc 뒤 harness가 멈췄다고 알리기를 기다리는 상한(밀리초). 넘으면 그대로 보낸다
stop_wait_ms = 15000
# brief를 보낸 뒤 새 보고가 오기 전까지 thread를 작업 중으로 치는 시간(초). 방금 일을 받은 agent는 아직 쉼으로 읽혀서다
delivered_working_secs = 15
# inbox에서 끝낸 항목을 지우기까지 날짜
inbox_done_days = 30
# 아이디어 전용 thread가 이만큼(초) 쉬면 알림 없이 보류한다. 다시 말하거나 아이디어 화면을 열면 같은 대화로 잇는다
idea_rest_secs = 1800
# routine 명령을 실행해도 되는 프로젝트(옛 자리, "*"는 모두). [safety.*] routine_commands가 있으면 그것이 먼저다.
# 실행하려면 `aaa routine approve`로 사람이 명령을 승인해야 한다.
routine_commands = []

[notify]
# 알림 webhook(비우면 끈다). https만 받는다. 봇 token이 들어가면 이 줄은 host.local.toml에 둔다.
# 텔레그램 예: webhook = "https://api.telegram.org/bot<token>/sendMessage", format = "telegram", telegram_chat_id = "<chat>"
webhook = ""
# json(항목 목록과 글) 또는 telegram
format = "json"
telegram_chat_id = ""
# 알릴 inbox 항목 종류. thread-state는 확인 필요·새 보고·시작 실패만, pr은 병합·check 실패·리뷰 활동만 보낸다
# (옛 이름 report·question·delivery·thread도 thread-state로 읽는다)
kinds = ["thread-state", "session", "outage", "health", "routine-approval"]
# 이 시간(초) 동안 모아 프로젝트마다 한 통으로 보낸다
debounce_secs = 15
# 웹에서 「알림 켜기」한 기기에 Web Push로도 보낸다(내용은 암호화돼 push 서비스가 읽지 못한다)
web_push = true
# 구독 주소로 받는 push 서비스 호스트(그 이름이거나 그 아래 이름, https만)
push_hosts = ["fcm.googleapis.com", "push.apple.com", "push.services.mozilla.com", "notify.windows.com"]
# VAPID 연락처(비우면 프로젝트 저장소 주소. 공개 주소는 push 사업자에게 보내지 않는다)
push_subject = ""

[session]
# 재부팅 뒤 Claude·Codex pane과 thread를 저장한 대화로 이어 띄운다(herdr와 같다). 꺼도 셸 pane은 저장한 폴더에서 되살린다.
resume_agents_on_restore = true
# 이어 띄우기 사이 간격(ms)
startup_per_agent_delay_ms = 100

# 정해지지 않았을 때 쓰는 값. `aaa profile default threads|coordinator <이름>`이 고친다.
[defaults]
# thread start에 --profile이 없고 project.toml thread_profile도 없을 때 쓰는 profile(비우면 기본 profile claude)
thread_profile = ""
# aaa project open에 --profile이 없고 project.toml coordinator_profile도 없을 때 쓰는 profile(비우면 claude)
coordinator_profile = ""

# 실행 파일 바꾸기(`aaa update --from <파일>`·`aaa update rollback`). agent.toml에 둬도 된다(둘 다 적으면 둘 다 지킨다).
[update]
# 고정한 version: 새 실행 파일이 이 version이어야 바꾼다. 비면 고정하지 않는다(major가 바뀌는 것은 고정해야만 바꾼다)
version = ""
# 보관하는 옛 실행 파일 수(실행 파일 옆 .aaa-old/, 1~100)
keep = 3

# safety: 사람만 바꾼다(`aaa safety show|yolo|set`, `aaa profile allow`). 프로젝트 폴더 밖이라 coordinator가 고치지 못한다.
# [safety.default]는 모든 프로젝트, [safety.<프로젝트>]는 그 프로젝트다. 빠진 값은 아래 층(default 표 → 옛 자리 → 기본값)을 따른다.
# [safety.default]
# yolo = false                 # 켜면 thread를 묻지 않고 시작하고 claude·codex thread를 권한 건너뛰기 인자로 띄운다
# start_threads = "propose"    # propose(제안하고 승인을 기다림)·auto. yolo면 auto
# trust_screens = "user"       # thread pane 신뢰 창에 답하는 쪽: user·coordinator. 없으면 yolo를 따른다
# thread_agent_args = []       # 프로젝트 기본 profile과 같은 harness의 기본 profile에 붙이는 인자
# routine_commands = false     # routine 명령 실행(명령마다 사람 승인도 필요하다)
# thread_profiles = ["claude"] # thread가 쓸 수 있는 profile(없으면 모두)

# 모든 머신이 쓰는 profile 정의(herdr-projects 0.2.x와 같은 키).
# claude·codex는 정의 없이도 같은 이름의 기본 profile이다. 같은 이름을 쓰면 아래 정의가 대신한다.
[profiles.review]
agent = "codex"
model = ""
effort = "high"
description = "검토할 일"
args = []
