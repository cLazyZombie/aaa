# aaa host backend 설정. 위치: macOS ~/.config/aaa/host.toml (AAA_CONFIG_DIR로 바꿀 수 있다)
# 머신별 값은 같은 폴더의 host.local.toml에 두면 덮어쓴다.
schema = 1

[host]
# Agent link(TCP+TLS 1.3) listen 주소. 원격 agent가 여기로 연결한다. 빈 문자열이면 원격을 받지 않는다.
agent_listen = "0.0.0.0:7430"

[web]
# host 웹은 loopback에서만 연다. 다른 기기에는 `aaa web publish`(tailscale serve HTTPS)로 연다.
listen = "127.0.0.1:7431"
# publish 후보 HTTPS 포트. serve status에서 이미 쓰는 포트는 건너뛴다.
publish_ports = [443, 8443, 7443, 17443]

[local_agent]
# child: 개발 모드(host가 로컬 agent를 띄움), launchd: 운영 모드(LaunchAgent가 띄움), none: 쓰지 않음
mode = "child"

[tui]
# aaa attach의 명령 prefix 키(herdr 형식, 여러 개면 배열). tmux 안에서 쓰면 tmux와 겹치지 않게 바꾼다(예: "ctrl+g").
prefix = "ctrl+b"
# prefix·탐색 모드 동안 한글 입력기면 잠깐 영문 입력기로 바꾸고 되돌린다(macOS·ssh 밖, herdr처럼 기본 끔).
switch_ascii_input_source_in_prefix = false
# prefix 뒤 두벌식 자모(ㅊ)를 같은 자리 영문 키(c)로 읽는다(기본 끔).
prefix_jamo_keys = false
# 새 탭(prefix c)을 만들기 전에 이름을 묻는다(빈 채로·기본값 그대로 Enter면 자리 번호).
prompt_new_tab_name = true
# 마지막 탭·마지막 pane을 닫기 전에 묻는다.
confirm_close = true

[terminal]
# 새 탭·나누기 pane의 폴더: "follow"(원래 pane이 지금 있는 폴더, 같은 머신일 때), "home", 또는 절대 경로
new_cwd = "follow"

[projects]
# 프로젝트 폴더 root(비우면 ~/.aaa/projects)
root = ""
# thread에 쓸 수 있는 profile(agent.toml에 정의). "*"는 모두 허용한다.
allow_profiles = ["*"]
# 보고와 함께 host로 복사할 library 상한(MB). 넘는 파일은 agent에 남는다.
library_copy_mb = 200
# brief에 넣을 memory 글자 수 상한
brief_memory_chars = 32000
# ticker 주기(초). inbox 항목이 생기거나 harness가 입력 대기가 되면 주기를 기다리지 않고 돈다.
tick_secs = 15
# coordinator가 이만큼(초) 입력 대기 상태로 머물러야 inbox 알림(nudge)을 보낸다
nudge_idle_secs = 60
# coordinator 입력창이 이만큼(초) 비어 있어야 nudge를 보낸다(사람이 치는 글과 섞이지 않게)
nudge_quiet_secs = 10
# 머신이 이만큼(초) 끊겨 있으면 inbox에 outage 항목을 만든다
outage_secs = 600
# inbox에서 끝낸 항목을 지우기까지 날짜
inbox_done_days = 30
# 머신 하나에서 동시에 도는 thread 한도(0이면 제한 없음)
max_threads_per_machine = 6
# routine 명령을 실행해도 되는 프로젝트("*"는 모두). 실행하려면 `aaa routine approve`로 사람이 명령을 승인해야 한다.
routine_commands = []

[notify]
# 알림 webhook(비우면 끈다). https만 받는다. 봇 token이 들어가면 이 줄은 host.local.toml에 둔다.
# 텔레그램 예: webhook = "https://api.telegram.org/bot<token>/sendMessage", format = "telegram", telegram_chat_id = "<chat>"
webhook = ""
# json(항목 목록과 글) 또는 telegram
format = "json"
telegram_chat_id = ""
# 알릴 inbox 항목 종류. thread-state는 사람 차례·새 보고·시작 실패만 보낸다(옛 이름 report·question·delivery·thread도 이것으로 읽는다)
kinds = ["thread-state", "session", "outage", "health", "routine-approval"]
# 이 시간(초) 동안 모아 프로젝트마다 한 통으로 보낸다
debounce_secs = 15
# 웹에서 「알림 켜기」한 기기에 Web Push로도 보낸다(내용은 암호화돼 push 서비스가 읽지 못한다)
web_push = true
# 구독 주소로 받는 push 서비스 호스트(그 이름이거나 그 아래 이름, https만)
push_hosts = ["fcm.googleapis.com", "push.apple.com", "push.services.mozilla.com", "notify.windows.com"]
# VAPID 연락처(비우면 공개 주소 https://<이름>.ts.net)
push_subject = ""
