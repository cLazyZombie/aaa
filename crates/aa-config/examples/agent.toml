# aa agent backend 설정. 위치: macOS ~/.config/aa/agent.toml, Linux $XDG_CONFIG_HOME/aa/agent.toml,
# Windows %LOCALAPPDATA%\aa\config\agent.toml (AA_CONFIG_DIR로 바꿀 수 있다)
schema = 1

[agent]
# 머신 이름(비우면 hostname)
name = ""
# host 주소. 같은 머신의 host면 "local", 아니면 "<이름 또는 주소>:<포트>"
host = "local"
# 새 세션 기본 작업 폴더(비우면 HOME)
default_cwd = ""

[reconnect]
max_backoff_s = 60

[selfcheck]
# 시작 때 첫 실행 지연 표본 수(macOS). P0 측정은 30.
first_exec_samples = 5
# 실제로 읽어 볼 키체인 generic password의 service 이름(비우면 잠금 bit만 본다)
keychain_service = ""
# 읽기·쓰기를 확인할 외장 볼륨 폴더(선택)
volume_dir = ""
