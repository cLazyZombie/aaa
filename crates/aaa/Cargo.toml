[package]
name = "aaa"
description = "aaa 진입점: 한 실행 파일에서 역할(host·agent·session host·TUI·CLI)을 고르고 doctor를 연다"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "aaa"
path = "src/main.rs"

[dependencies]
aaa-proto.workspace = true
aaa-config.workspace = true
aaa-common.workspace = true
aaa-doctor.workspace = true
aaa-session.workspace = true
aaa-agent.workspace = true
aaa-host.workspace = true
aaa-tui.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-service-management = "0.3"

[dev-dependencies]
libc.workspace = true
portable-pty.workspace = true
# TUI harness의 독립 관측 parser(production VT인 vt100과 다른 구현)
vte = "0.15"
unicode-width = "0.2"
# TUI Ctrl+V 그림 E2E: 받은 PNG를 풀어 pixel을 보고, CI에서는 실제 clipboard에 쓴다
png = "0.18"
arboard = { version = "3", default-features = false, features = ["image-data"] }
