[package]
name = "aaa"
description = "aaa 진입점: 한 실행 파일에서 역할(host·agent·session host·CLI)을 고르고 doctor를 연다"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "aaa"
path = "src/main.rs"

[dependencies]
aaa-proto.workspace = true
aaa-config.workspace = true
aaa-common.workspace = true
aaa-doctor.workspace = true
aaa-session.workspace = true
aaa-agent.workspace = true
aaa-host.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
base64.workspace = true
# `aaa update`: 바꾸기 전후 실행 파일 비교
sha2.workspace = true
hex.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
# `aaa completion`(herdr와 같은 crate)
clap_complete = "4"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-service-management = "0.3"

[dev-dependencies]
libc.workspace = true
rusqlite = "0.37"
portable-pty.workspace = true
