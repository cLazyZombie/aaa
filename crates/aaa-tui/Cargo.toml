[package]
name = "aaa-tui"
description = "aaa TUI front(`aaa attach`). host와는 aaa-proto Front API로만 말하고 backend crate에 의존하지 않는다"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aaa-proto.workspace = true
aaa-config.workspace = true
aaa-common.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
# front 기기 clipboard 그림(§8.28). 순수 Rust(X11은 x11rb)라 Linux 빌드에 개발 파일이 필요 없다
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.18"
# 고른 글 복사(OSC 52, ssh 셸)
base64.workspace = true
sha2.workspace = true
# 이름 입력 창의 grapheme 커서·넓은 글자 폭(herdr text_editor와 같은 crate, ratatui가 이미 쓴다)
unicode-segmentation = "1"
unicode-width = "0.2"

# prefix 동안 한국어 IME를 영문으로(herdr Windows 방식, input_source::win), pane 링크 열기(ShellExecuteW, open.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory"] }
