[package]
name = "aaa-agent"
description = "aaa agent backend: 머신 API, session host 감독, Agent link(host 쪽과는 aaa-proto 계약으로만 말한다)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aaa-proto.workspace = true
aaa-config.workspace = true
aaa-common.workspace = true
aaa-session.workspace = true
aaa-doctor.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
hex.workspace = true
rand.workspace = true
tracing.workspace = true
tokio-rustls.workspace = true
sha2.workspace = true
regex.workspace = true
toml.workspace = true
toml_edit.workspace = true
# 파일 보기 HTML 페이지에 제 폴더 파일을 data: URL로 넣는다(page.rs)
base64.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# pane cwd follow: 다른 프로세스의 PEB에서 작업 폴더를 읽는다(herdr 방식, cwd::win)
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
aaa-test-support.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# cwd 시험: pane처럼 PTY 안에서 셸을 띄운다(제어 터미널의 앞 그룹을 읽는 길)
portable-pty.workspace = true
