[package]
name = "aa"
description = "aa: 여러 머신의 agent 오케스트레이션(host·agent·session host·CLI를 한 실행 파일로)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "aa"
path = "src/main.rs"

[dependencies]
aa-proto.workspace = true
aa-config.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ulid.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
portable-pty = "0.9"
vt100 = "0.16"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
rusqlite = { version = "0.37", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-service-management = "0.3"
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[dev-dependencies]
# TUI harness의 독립 관측 parser(production VT인 vt100과 다른 구현)
vte = "0.15"
unicode-width = "0.2"

[build-dependencies]
cc = "1"
