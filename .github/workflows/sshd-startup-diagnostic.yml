name: sshd startup diagnostic
on:
  push:
    branches: [diagnostic/t-0827-sshd-startup]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: SYSTEM sshd startup diagnostics
        shell: pwsh
        run: ./scripts/ci-windows-sshd.ps1 -StartOnly
