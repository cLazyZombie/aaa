name: t-1159 Windows 승인 정지 진단

on:
  push:
    branches: [diagnostic/t-1159-windows-approval]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  windows-approval:
    name: Windows Server 2025 승인 PTY 진단
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Rust stable
        id: rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v1-diagnostic-windows-approval-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.week }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-v1-rust-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.week }}-${{ hashFiles('Cargo.lock') }}
            cargo-v1-rust-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.week }}-
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 원본 CI와 같은 웹 자산 준비
        shell: bash
        run: |
          mkdir -p .diagnostic-output
          (cd web && npm ci && npm run build) > .diagnostic-output/web.log 2>&1
      - name: 시험 실행 파일과 PDB 빌드
        shell: bash
        run: |
          mkdir -p .diagnostic-output
          cargo test --profile verify --locked -p aaa --test install --no-run --message-format=json > .diagnostic-output/build-artifacts.jsonl 2> .diagnostic-output/build.log
      - name: 실제 실행 파일과 PDB SHA 기록
        id: binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifacts = @(Get-Content .diagnostic-output/build-artifacts.jsonl | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' })
          $test = @($artifacts | Where-Object { $_.target.name -eq 'install' -and $_.executable })
          $cli = @($artifacts | Where-Object { $_.target.name -eq 'aaa' -and $_.target.kind -contains 'bin' -and $_.executable -and !$_.profile.test })
          if ($test.Count -ne 1 -or $cli.Count -ne 1) { throw '실제 install/aaa artifact가 각각 하나여야 한다' }
          $files = @(@($test[0], $cli[0]) | ForEach-Object { $_.filenames; $_.executable } | Sort-Object -Unique | Where-Object { [IO.Path]::GetExtension($_) -in @('.exe', '.pdb') })
          # Cargo 판에 따라 filenames에서 빠지는 sidecar도 같은 실행 파일의 이름으로 확인한다.
          $files = @($files + @($test[0].executable, $cli[0].executable | ForEach-Object { [IO.Path]::ChangeExtension($_, '.pdb') }) | Sort-Object -Unique | Where-Object { Test-Path -LiteralPath $_ })
          if (@($files | Where-Object { $_.EndsWith('.pdb') }).Count -lt 2) { throw '실제 시험/CLI PDB 두 개가 필요하다' }
          $hashes = @($files | ForEach-Object { [ordered]@{ file=[IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $_); bytes=(Get-Item -LiteralPath $_).Length; sha256=(Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() } })
          $hashes | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 .diagnostic-output/sha256.json
          [ordered]@{
            base_sha='b61c276dc4faeda97bd4feada31f9688ed900665'
            head_sha=$env:GITHUB_SHA
            run_id=$env:GITHUB_RUN_ID
            run_attempt=$env:GITHUB_RUN_ATTEMPT
            os=@(Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber)
            rustc=(& rustc -V)
            experiment='exact test per process; 8 parallel processes; 4 predetermined waves; stop after first failing wave'
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 .diagnostic-output/environment.json
          Add-Content -Path $env:GITHUB_OUTPUT -Value "test_binary=$($test[0].executable)"
      - name: native stack 대조와 기존 승인 시험의 재현 실험
        shell: pwsh
        run: |
          ./scripts/diagnostic-windows-approval.ps1 -TestBinary '${{ steps.binary.outputs.test_binary }}' -Output .diagnostic-output/run
      - name: 진단 원문 보존
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t-1159-windows-approval-${{ github.run_id }}-${{ github.run_attempt }}
          # tmp에는 취소된 실험실의 발급 키가 남을 수 있어 폴더 전체를 올리지 않는다.
          path: |
            .diagnostic-output/*.log
            .diagnostic-output/*.jsonl
            .diagnostic-output/*.json
            .diagnostic-output/run/proof.stdout
            .diagnostic-output/run/proof.stderr
            .diagnostic-output/run/trial-*.stdout
            .diagnostic-output/run/trial-*.stderr
            .diagnostic-output/run/trials.json
            .diagnostic-output/run/trace/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
