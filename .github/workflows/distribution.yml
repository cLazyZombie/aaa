name: release 계약

on:
  pull_request:
    paths: [".github/workflows/release.yml", ".github/workflows/distribution.yml", "scripts/release.py", "scripts/test_release.py", "Cargo.toml"]
  push:
    branches: [main]
    paths: [".github/workflows/release.yml", ".github/workflows/distribution.yml", "scripts/release.py", "scripts/test_release.py", "Cargo.toml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: release 도구 계약 시험
        run: python3 -m unittest scripts.test_release
