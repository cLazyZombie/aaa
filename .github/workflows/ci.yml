name: ci

on:
  push:
    branches: [main, "hp/**"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  # 웹 front E2E(web/e2e/web.e2e.mjs): 실제 host·agent와 headless Chromium·WebKit. 터미널 한글 IME 기록 재생
  # (macOS Safari·iPad 하드웨어 키보드·화면 키보드가 올라온 iPad)이 웹·터미널 코드를 바꾸는 모든 commit에서 돈다.
  web-e2e:
    name: web-e2e (macos-15)
    runs-on: macos-15
    timeout-minutes: 40
    env:
      PLAYWRIGHT_VERSION: "1.59.1"
    steps:
      - uses: actions/checkout@v5
      - name: Rust stable
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # Rust 빌드 캐시(결정 D1). 설명은 rust job의 같은 단계에 있다.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v1-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.week }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-v1-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.week }}-
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Playwright 브라우저 캐시(결정 D3). 키는 playwright 판이다. 복원한 뒤에도 install을 돈다:
      # 다 있으면 받지 않고 넘어가고, 빠진 브라우저만 받는다.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}
      # 단계 명령은 scripts/ci-local.sh에만 있다(로컬 검증과 같은 명령)
      - name: Playwright(Chromium·WebKit)
        run: npm install -g --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION" && npx -y "playwright@$PLAYWRIGHT_VERSION" install chromium webkit
      # e2e는 target/debug/aaa만 쓴다: build 단계(--all-targets, 시험 binary 포함) 대신 e2e 단계가 그 binary만 빌드한다.
      # 단계를 나눠 두면 GitHub step 시간에 웹 빌드와 E2E가 따로 보인다.
      - name: 웹 빌드
        run: bash scripts/ci-local.sh --only web --logs . --tee
      - name: 웹 E2E(aaa 빌드 포함)
        run: bash scripts/ci-local.sh --only e2e --logs . --tee
      - name: 실패 요약
        if: failure()
        run: |
          set +e +o pipefail
          grep -nE '^(ok|FAIL) |IME ' e2e.log | tail -60
          for d in /tmp/aaw-*; do
            [ -d "$d" ] || continue
            for f in "$d"/*.log; do echo "## $f"; tail -c 3000 "$f"; done
          done
          true

  rust:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      # 생성 파일(web/src/gen/proto.ts) 최신 확인 테스트가 줄 끝을 비교한다
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - name: Rust stable
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable
          rustc --version
          echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # Rust 빌드 캐시(결정 D1): 의존 crate 받은 것(registry·git)과 target. 키는 job·OS·rustc 판·주·Cargo.lock이다.
      # - 키가 꼭 맞으면 복원만 하고 다시 저장하지 않는다(키마다 한 번 쓴다). 그래서 한 주 안에서는 커지지 않는다.
      # - Cargo.lock이 바뀌면 같은 주의 캐시를 이어 받아 짓고 새 키로 저장한다. 주가 바뀌면 처음부터 지어 새로 저장한다.
      # - 복원이 실패하면(받기 오류·없음) 캐시 없이 처음부터 짓는다. 다시 짓는 판단은 cargo fingerprint가 한다.
      #   받은 파일이 깨져 빌드가 실패하면 통과로 넘어가지 않는다: 그때는 key의 v1을 올려 버린다.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v1-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.week }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-v1-${{ github.job }}-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.week }}-
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # 단계 명령은 scripts/ci-local.sh에만 있다(로컬 검증과 같은 명령). 여기서는 OS별로 어느 단계를 도는지만 정한다.
      - name: 웹 front 빌드(host 실행 파일에 포함)
        run: bash scripts/ci-local.sh --only web --logs . --tee
      - name: fmt
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/ci-local.sh --only fmt --logs . --tee
      - name: build
        id: build
        run: bash scripts/ci-local.sh --only build --logs . --tee
      - name: clippy
        run: bash scripts/ci-local.sh --only clippy --logs . --tee
      # 유닛·프로토콜 계약 테스트와 PTY smoke(Windows는 ConPTY + Named Pipe). e2e는 Unix에서만 돈다.
      - name: test
        # clippy가 실패해도 build가 됐으면 테스트 결과를 본다
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash scripts/ci-local.sh --only test --logs . --tee
      # 실제 시스템 clipboard(§8.28): 그림을 쓰고 TUI front가 Ctrl+V로 읽어 대상 세션 폴더까지 가는지 본다.
      # 개발 Mac에서는 사람의 clipboard를 덮어쓰므로 CI에서만 켠다. Linux는 Xvfb 위 X11, Windows는 TUI E2E(Unix 전용) 없이 읽기만.
      - name: clipboard(실제)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          AAA_CLIP_NATIVE: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends xvfb >/dev/null; fi
          bash scripts/ci-local.sh --only clipboard --logs . --tee
      # 공개 저장소 검사(push 전 로컬 검사의 안전망). 얕은 checkout이라 origin/main..HEAD가 비어 커밋 메시지·author는 보지 않고,
      # private-words가 없어 실제 이름도 보지 않는다: 여기의 통과는 추적 파일의 확장자·크기·내용 패턴만 본 결과다.
      - name: public
        if: ${{ !cancelled() && matrix.os == 'ubuntu-24.04' }}
        run: bash scripts/ci-local.sh --only public --logs . --tee
      # 로그를 내려받지 않고도 원인을 보도록 실패 내용을 annotation으로 남긴다.
      - name: 실패 요약
        if: failure()
        run: |
          # 기본 셸은 -e -o pipefail이다. 찾는 줄이 없어도 요약은 끝까지 간다.
          set +e +o pipefail
          # annotation은 step마다 개수 제한이 있어 파일별이 아니라 묶음별로 하나씩 남긴다.
          annotate() {
            node -e 'let t=require("fs").readFileSync(0,"utf8"); if(t.length>15000) t=t.slice(0,3000)+"\n…\n"+t.slice(-12000); if(t.trim()) console.log("::error title="+process.argv[1]+"::"+t.replace(/%/g,"%25").replace(/\r/g,"").replace(/\n/g,"%0A"))' "$1"
          }
          for f in build.log clippy.log; do
            [ -f "$f" ] || continue
            grep -nE -A8 "^error|^warning" "$f" | head -80 | annotate "$f"
          done
          # 테스트 실패 본문(진단 출력 포함)
          for f in test.log clipboard.log; do
            [ -f "$f" ] && awk '/^failures:/{p=1} p{print} /^test result: FAILED/{p=0}' "$f" | annotate "$f"
          done
          # 실험실: 남겨진 host·agent 로그와 세션 폴더(session-host.log, exit.json, meta.json)
          for d in $(cat test.log clipboard.log 2>/dev/null | grep -o '실험실 기록을 남겼다: .*'  | sed 's/^실험실 기록을 남겼다: //' | sort -u); do
            [ -d "$d" ] || d=$(cygpath -u "$d" 2>/dev/null)
            [ -d "$d" ] || continue
            find "$d" -type f \( -name '*.log' -o -name '*.json' \) | while read -r f; do
              echo "## ${f#"$d"/}"; tail -c 1500 "$f"; echo
            done | annotate "$(basename "$d")"
          done
          true
