name: ci

on:
  push:
    branches: [main, "hp/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_native_diagnostic:
        description: Windows 설치 준비 반복 진단
        type: boolean
        default: false
      e2e_route_diagnostic:
        description: E2E 136 라우트 수명 반복 진단
        type: boolean
        default: false
      macos_arm_diagnostic:
        description: macOS arm64 전수·실제 설치 진단
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  # 웹 front E2E(web/e2e/web.e2e.mjs): 실제 host·agent와 headless Chromium·WebKit. 터미널 한글 IME 기록 재생
  # (macOS Safari·iPad 하드웨어 키보드·화면 키보드가 올라온 iPad)이 웹·터미널 코드를 바꾸는 모든 commit에서 돈다.
  web-e2e:
    if: ${{ !inputs.windows_native_diagnostic && !inputs.macos_arm_diagnostic }}
    name: web-e2e (macos-15-intel, ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.e2e_route_diagnostic && '[2]' || '[1,2,3]') }}
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      PLAYWRIGHT_VERSION: "1.64.1"
      # 4 CPU Intel 러너에서 host·agent·두 브라우저를 두 벌 돌리지 않는다. 모든 spec·기기는
      # 세 독립 러너에 나누고 한 러너는 하나씩 실행한다. 로컬 착지 gate는 전수·재시도 0이다.
      AAA_E2E_WORKERS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Rust stable
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # Rust 빌드 캐시(결정 D1). 설명은 rust job의 같은 단계에 있다.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v2-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.week }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-v2-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.week }}-
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Playwright 브라우저 캐시(결정 D3). 키는 playwright 판이다. 복원한 뒤에도 install을 돈다:
      # 다 있으면 받지 않고 넘어가고, 빠진 브라우저만 받는다.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}
      # 단계 명령은 scripts/ci-local.sh에만 있다(로컬 검증과 같은 명령)
      - name: Playwright(Chromium·WebKit)
        run: npm install -g --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION" && npx -y "playwright@$PLAYWRIGHT_VERSION" install chromium webkit
      # 웹 전용 job은 target/e2e/aaa만 쓴다. Rust job의 verify unit 사전 컴파일은 필요 없다.
      # 단계를 나눠 두면 GitHub step 시간에 웹 빌드와 E2E가 따로 보인다.
      - name: 웹 빌드
        run: bash scripts/ci-local.sh --only web --logs . --tee
      - name: 웹 E2E(aaa 빌드 포함)
        id: e2e
        # job 전체가 취소되기 전에 실패로 끝내 최초 로그·시도 요약을 올린다.
        timeout-minutes: 30
        env:
          AAA_E2E_SHARD: "${{ matrix.shard }}/3"
          AAA_E2E_RETRIES: "1"
        run: |
          if [ '${{ inputs.e2e_route_diagnostic }}' = true ]; then
            export DEBUG=pw:api AAA_E2E_ROUTE_DIAGNOSTIC=1 AAA_E2E_RETRIES=0
            for round in 1 2 3 4 5 6 7 8; do
              echo "E2E 136 독립 진단 $round/8"
              bash scripts/ci-local.sh --only e2e --spec 136 --logs . --tee
            done
          else
            bash scripts/ci-local.sh --only e2e --logs . --tee
          fi
      - name: 웹 E2E 결과·진단
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-e2e-result-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e.log
            e2e-binary.log
            workspace-summary.tsv
            e2e-failures/
          retention-days: 14
      - name: 실패 요약
        if: failure()
        run: |
          set +e +o pipefail
          grep -nE '^(ok|FAIL) |IME ' e2e.log | tail -60
          for d in /tmp/aaw-*; do
            [ -d "$d" ] || continue
            for f in "$d"/*.log; do echo "## $f"; tail -c 3000 "$f"; done
          done
          true

  rust:
    if: ${{ inputs.windows_native_diagnostic || inputs.macos_arm_diagnostic || !inputs.e2e_route_diagnostic }}
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_native_diagnostic && '["windows-2025"]' || inputs.macos_arm_diagnostic && '["macos-15"]' || '["macos-15-intel","ubuntu-24.04","windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    # Intel 전수의 첫 verify codegen·실제 설치까지 수용한다. 개별 owner의 시한은 그대로다.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 60 || 40 }}
    steps:
      # 생성 파일(web/src/gen/proto.ts) 최신 확인 테스트가 줄 끝을 비교한다
      - run: git config --global core.autocrlf false
      # ubuntu는 이력을 모두 받는다(약 11MiB): 공개 검사가 이번 push·PR의 커밋 메시지·author를, 고정 sleep ratchet이
      # 기준의 기준 파일을 본다. 얕은 checkout이면 둘 다 볼 커밋이 없어 늘 건너뛰었다(10-18 감사)
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ matrix.os == 'ubuntu-24.04' && '0' || '1' }}
      - name: Rust stable
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable
          rustc --version
          echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # Rust 빌드 캐시(결정 D1): 의존 crate 받은 것(registry·git)과 target. 키는 job·OS·rustc 판·주·Cargo.lock이다.
      # - 키가 꼭 맞으면 복원만 하고 다시 저장하지 않는다(키마다 한 번 쓴다). 그래서 한 주 안에서는 커지지 않는다.
      # - Cargo.lock이 바뀌면 같은 주의 캐시를 이어 받아 짓고 새 키로 저장한다. 주가 바뀌면 처음부터 지어 새로 저장한다.
      # - 복원이 실패하면(받기 오류·없음) 캐시 없이 처음부터 짓는다. 다시 짓는 판단은 cargo fingerprint가 한다.
      #   받은 파일이 깨져 빌드가 실패하면 통과로 넘어가지 않는다: 그때는 key의 v1을 올려 버린다.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v2-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.week }}-${{ hashFiles('Cargo.lock') }}
          # 기존 Rust 키의 OS별 아키텍처가 같은 조합만 전환 캐시로 받는다. Intel 웹은 이 예외를 쓰지 않는다.
          restore-keys: |
            cargo-v2-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.week }}-
            ${{ (runner.os == 'macOS' && runner.arch == 'ARM64' || runner.os != 'macOS' && runner.arch == 'X64') && format('cargo-v1-{0}-{1}-{2}-{3}-', github.job, runner.os, steps.rust.outputs.rustc, steps.rust.outputs.week) || '' }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # 단계 명령은 scripts/ci-local.sh에만 있다(로컬 검증과 같은 명령). 여기서는 OS별로 어느 단계를 도는지만 정한다.
      - name: 웹 front 빌드(host 실행 파일에 포함)
        env:
          # 고정 sleep ratchet 「origin/main보다 올리지 않는다」의 기준(web/test/fixed-sleeps.test.mjs). 주면 건너뛰지 않는다.
          # main push는 그 전 main(origin/main이 이미 HEAD라 자기와 비교하게 된다), 그 밖에는 origin/main. 이력이 있는 ubuntu만
          AAA_SLEEP_BASE: ${{ matrix.os == 'ubuntu-24.04' && (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before || 'origin/main') || '' }}
        run: bash scripts/ci-local.sh --only web --logs . --tee
      - name: fmt
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/ci-local.sh --only fmt --logs . --tee
      - name: build
        id: build
        # Unix Rust job의 독립 CLI와 시험은 verify 의존 산출물을 공유한다.
        # Windows 실제 설치 owner는 target/e2e/aaa.exe를 소비한다.
        run: bash scripts/ci-local.sh --only build ${{ runner.os != 'Windows' && '--verify-cli' || '' }} --logs . --tee
      - name: clippy
        run: bash scripts/ci-local.sh --only clippy --logs . --tee
      # 유닛·프로토콜 계약 테스트와 PTY smoke(Windows는 ConPTY + Named Pipe). e2e는 Unix에서만 돈다.
      - name: test
        id: test
        # clippy가 실패해도 build가 됐으면 테스트 결과를 본다
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # 끝나지 않는 시험은 job 한도(40분)에 취소되면 실패 요약이 돌지 않는다. 단계 한도로 실패로 끝내 요약을 남긴다
        timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 25 || 15 }}
        # Unix는 owner 실행기가 CPU 수만큼 binary를 이미 나눈다. 안쪽까지 8개씩
        # 돌리면 3 CPU에 24개 시험이 겹친다. Windows는 단일 Cargo 실행이므로 2개다.
        # 가짜 host·agent·CLI마다 만드는 Tokio runtime도 2 thread로 제한한다.
        env:
          RUST_TEST_THREADS: ${{ matrix.os == 'windows-2025' && '2' || '1' }}
          TOKIO_WORKER_THREADS: "2"
          AAA_CI_MACOS_INSTALL_PTY_DIAGNOSTICS: ${{ matrix.os == 'macos-15-intel' && '1' || '0' }}
          AAA_CI_WINDOWS_INSTALL_RECHECK: ${{ matrix.os == 'windows-2025' && !inputs.windows_native_diagnostic && '1' || '0' }}
        run: bash scripts/ci-local.sh --only test --logs . --tee
      # 완료를 기다려 출력하던 shard는 단계 중단 시 사라졌다. 준비/목록/실행 중 원문과
      # 원자 상태·사건 기록을 후속 설치 시험보다 먼저 보존한다. 중단을 성공으로 바꾸지 않는다.
      - name: Rust 시험 원문·중단 진단
        if: ${{ always() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-tests-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test.log
            python.log
            rust/
            windows-install/
          if-no-files-found: ignore
          retention-days: 7
      # 운영 Mac에는 등록하지 않는다. 기존 일회성 CI 계정에서만 필수 실제 등록 owner를 돈다.
      - name: macOS LaunchAgent 실제 등록·ready·instance 보존
        if: ${{ !cancelled() && startsWith(matrix.os, 'macos-') && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: cargo test --profile verify -p aaa --test install --locked launchd::launchd_real_registration_ready_resume_and_second_instance_preserve_the_shared_launcher -- --ignored --exact --nocapture 2>&1 | tee launchd-registration.log
      # 「SSH로 추가」 실제 경로(plan §8.420): install 검증 SSH 입구가 믿는 root sshd를 이 일회성 계정에만 띄운다. 원격 HOME은 실험실이고
      # 시험이 runner 실제 HOME이 그대로인지 본다. 운영 Mac에서는 돌리지 않는다(스크립트가 GITHUB_ACTIONS가 아니면 멈춘다).
      - name: SSH로 설치·등록 실제 root sshd·LaunchAgent
        if: ${{ !cancelled() && startsWith(matrix.os, 'macos-') && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: bash scripts/ci-root-sshd.sh 2>&1 | tee ssh-install.log
      # 암호는 일회성 시험 계정의 가짜 값이며 anonymous stdin만 쓴다. 기존 runner 계정/sshd 설정은 보존한다.
      - name: Windows SYSTEM SSH로 설치·사용자 SCM·등록
        if: ${{ !cancelled() && matrix.os == 'windows-2025' && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 일회 계정의 프로필은 증거로 남는다. 같은 VM의 기본 20GB 여유 조건 안에서 진단한다.
          $count = if ('${{ inputs.windows_native_diagnostic }}' -eq 'true') { 3 } else { 1 }
          for ($round = 1; $round -le $count; $round++) {
            Write-Host "M4 independent round=$round/$count"
            ./scripts/ci-windows-sshd.ps1
          }
      # 공개 저장소 검사(push 전 로컬 검사의 안전망): 추적 파일과 이번 push(before..after)·PR(base..)의 커밋 메시지·author.
      # 새 branch의 첫 push(created, before는 0뿐)는 origin/main 이후를 본다. 기준을 찾지 못하면 실패한다(CI에서는 건너뛰지 않는다).
      # private-words·세션 기록이 없어 실제 이름·실제 세션 id는 보지 않는다(push 전 로컬 검사의 몫).
      - name: public
        if: ${{ !cancelled() && matrix.os == 'ubuntu-24.04' }}
        env:
          AAA_PUBLIC_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (!github.event.created && github.event.before) || 'origin/main' }}
        run: bash scripts/ci-local.sh --only public --logs . --tee
      # annotation은 길이가 잘린다. 최초 owner 출력과 pipe 단계 기록은 원문 그대로 보존한다.
      - name: macOS pipe owner 원문·trace
        if: ${{ failure() && startsWith(matrix.os, 'macos-') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-pipe-owner-${{ github.run_attempt }}
          path: |
            rust/*-aaa_common.log
            target/pipe-window-*/*.trace
            target/pipe-window-*/*.stdout
            target/pipe-window-*/*.stderr
          if-no-files-found: ignore
          retention-days: 7
      # 로그를 내려받지 않고도 원인을 보도록 실패 내용을 annotation으로 남긴다.
      - name: 실패 요약
        if: failure()
        run: |
          # 기본 셸은 -e -o pipefail이다. 찾는 줄이 없어도 요약은 끝까지 간다.
          set +e +o pipefail
          # annotation은 step마다 개수 제한이 있어 파일별이 아니라 묶음별로 하나씩 남긴다.
          # 제목은 인자가 아니라 stdin 첫 줄로 넘긴다: Windows에서 한국어 인자가 code page를 거쳐 깨졌다(「ëë‚˜ì§€…」).
          annotate() {
            { printf '%s\n' "$1"; cat; } | node -e 'const a=require("fs").readFileSync(0,"utf8").replace(/\r/g,""); const i=a.indexOf("\n"); const e=(s)=>s.replace(/%/g,"%25").replace(/\n/g,"%0A"); let t=a.slice(i+1); if(t.length>15000) t=t.slice(0,3000)+"\n…\n"+t.slice(-12000); if(t.trim()) console.log("::error title="+e(a.slice(0,i)).replace(/:/g,"%3A").replace(/,/g,"%2C")+"::"+e(t))'
          }
          if [ -f launchd-registration.log ]; then tail -c 12000 launchd-registration.log | annotate 'macOS LaunchAgent'; fi
          if [ -f ssh-install.log ]; then tail -c 12000 ssh-install.log | annotate 'SSH로 설치·등록'; fi
          for f in build.log clippy.log; do
            [ -f "$f" ] || continue
            grep -nE -A8 "^error|^warning" "$f" | head -80 | annotate "$f"
          done
          # 테스트 실패 본문(진단 출력 포함)
          for f in test.log; do
            [ -f "$f" ] && awk '/^failures:/{p=1} p{print} /^test result: FAILED/{p=0}' "$f" | annotate "$f"
          done
          # 단계 한도로 멈춘 시험: 어느 binary(Running 줄)의 어느 시험이 끝나지 않았는지(libtest가 60초 넘으면 알린다)
          for f in test.log; do
            [ -f "$f" ] && grep -q 'has been running for over' "$f" && grep -E '^ +Running |has been running for over' "$f" | tail -20 | annotate "$f: 끝나지 않은 시험"
          done
          # 실험실: 남겨진 host·agent 로그와 세션 폴더(session-host.log, exit.json, meta.json)
          for d in $(cat test.log clipboard.log 2>/dev/null | grep -o '실험실 기록을 남겼다: .*'  | sed 's/^실험실 기록을 남겼다: //' | sort -u); do
            [ -d "$d" ] || d=$(cygpath -u "$d" 2>/dev/null)
            [ -d "$d" ] || continue
            # annotation은 공개다: 세션 spec.json의 token 값과 env의 …TOKEN·SECRET·PASSWORD·KEY 값은 가린다(일회용 러너 세션이라도
            # 비밀값 모양을 남기지 않는다). env는 ["이름", "값"]이라 한 줄이면 sed가, 이름과 값이 줄을 나누면 awk가 다음 줄을 가린다
            # (10-18 287c1d1 annotation에 AAA_HOOK_TOKEN 값이 그대로 나갔다)
            find "$d" -type f \( -name '*.log' -o -name '*.json' \) | while read -r f; do
              echo "## ${f#"$d"/}"; tail -c 1500 "$f"; echo
            done | sed -E 's/("token"[[:space:]]*:[[:space:]]*")[^"]*"/\1<가림>"/g; s/("[A-Z0-9_]*(TOKEN|SECRET|PASSWORD|KEY)[A-Z0-9_]*"[[:space:]]*,[[:space:]]*")[^"]*"/\1<가림>"/g' \
              | awk '{ if (m) sub(/"[^"]*"/, "\"<가림>\""); m = ($0 ~ /"[A-Z0-9_]*(TOKEN|SECRET|PASSWORD|KEY)[A-Z0-9_]*",[[:space:]]*$/); print }' \
              | annotate "$(basename "$d")"
          done
          true
