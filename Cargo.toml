[workspace]
resolver = "3"
# 역할별 crate(결정 13). 의존 규칙은 crates/aaa/tests/deps.rs가 검사한다.
members = [
    "crates/aaa-test-support",
    "crates/aaa-proto",
    "crates/aaa-config",
    "crates/aaa-common",
    "crates/aaa-vt",
    "crates/aaa-doctor",
    "crates/aaa-session",
    "crates/aaa-agent",
    "crates/aaa-host",
    "crates/aaa",
]
# 들여온 vt100(글자 폭을 웹과 같게 고친 판, vendor/vt100/README.md). workspace 시험·lint 대상이 아니다
exclude = ["vendor/vt100"]
default-members = [
    "crates/aaa-test-support",
    "crates/aaa-proto",
    "crates/aaa-config",
    "crates/aaa-common",
    "crates/aaa-vt",
    "crates/aaa-doctor",
    "crates/aaa-session",
    "crates/aaa-agent",
    "crates/aaa-host",
    "crates/aaa",
]

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
aaa-test-support = { path = "crates/aaa-test-support" }
aaa-proto = { path = "crates/aaa-proto" }
aaa-config = { path = "crates/aaa-config" }
aaa-common = { path = "crates/aaa-common" }
aaa-vt = { path = "crates/aaa-vt" }
aaa-doctor = { path = "crates/aaa-doctor" }
aaa-session = { path = "crates/aaa-session" }
aaa-agent = { path = "crates/aaa-agent" }
aaa-host = { path = "crates/aaa-host" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1"
regex = "1"
aho-corasick = "1"
toml_edit = "0.25"
ulid = { version = "1", features = ["serde"] }
base64 = "0.22"
# Web Push(VAPID ES256·ECDH·HKDF·AES-GCM). rustls가 이미 쓰는 판이다
ring = "0.17"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
libc = "0.2"
tracing = "0.1"
futures-util = "0.3"
portable-pty = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation"] }
dunce = "1.0.5"

# release는 사용자·기기에 전달하는 배포 산출물에만 쓴다. 내부 도구는 verify로 빌드한다.
# 실행 성능·크기는 배포 조건에서 비교하며 macOS/Windows 기호는 배포 스크립트가 별도 보관한다.
[profile.release]
opt-level = "s"
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
incremental = false
strip = "none"
panic = "unwind"

# 직접 개발은 빠른 재컴파일을, 반복 자동화는 kache 재사용을 우선한다.
[profile.dev]
opt-level = 0
debug = true
lto = false
incremental = true

# 실패 스택의 파일·줄을 재현하는 최소 정보다. 변수·타입 정보는 기존 dev/debugging에 둔다.
[profile.test]
inherits = "dev"
debug = "line-tables-only"
lto = "off"
codegen-units = 16
incremental = false

# 내부 CLI·일상 검증은 전역 LTO 없이 최소 최적화한다. 긴 시나리오의 기존 hot-path override는 유지한다.
[profile.verify]
inherits = "test"
opt-level = 0
debug = "line-tables-only"
lto = "off"
codegen-units = 16
incremental = false

# headless 자동화는 빌드+실행 합계를 우선한다. panic 위치는 남고 상세 스택은 verify/test로 재현한다.
[profile.e2e]
inherits = "verify"
opt-level = 0
debug = 0

# 기존 명령의 호환 별칭이다. 새 자동화는 verify/e2e를 명시한다.
[profile.dev-fast]
inherits = "verify"

# 변수·타입이 필요한 명시적인 디버거 조사에만 쓴다.
[profile.debugging]
inherits = "dev"
debug = true

[profile.dev.package.sha2]
opt-level = 3

# 배포 keeper는 실제 실행 파일을 base64 JSON 조각으로 왕복한다. 두 의존성의 처리 비용만 줄이고
# dev/test의 debug assertions·실제 실행 파일 전송·검증 경계는 유지한다.

[profile.dev.package.base64]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

# session host 화면이 웹과 같은 칸을 쓰도록 글자 폭을 고친 vt100(plan §8.167)
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
