[workspace]
resolver = "3"
# 역할별 crate(결정 13). 의존 규칙은 crates/aa/tests/deps.rs가 검사한다.
members = [
    "crates/aa-proto",
    "crates/aa-config",
    "crates/aa-common",
    "crates/aa-vt",
    "crates/aa-doctor",
    "crates/aa-session",
    "crates/aa-agent",
    "crates/aa-host",
    "crates/aa-tui",
    "crates/aa",
]
default-members = [
    "crates/aa-proto",
    "crates/aa-config",
    "crates/aa-common",
    "crates/aa-vt",
    "crates/aa-doctor",
    "crates/aa-session",
    "crates/aa-agent",
    "crates/aa-host",
    "crates/aa-tui",
    "crates/aa",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
aa-proto = { path = "crates/aa-proto" }
aa-config = { path = "crates/aa-config" }
aa-common = { path = "crates/aa-common" }
aa-vt = { path = "crates/aa-vt" }
aa-doctor = { path = "crates/aa-doctor" }
aa-session = { path = "crates/aa-session" }
aa-agent = { path = "crates/aa-agent" }
aa-host = { path = "crates/aa-host" }
aa-tui = { path = "crates/aa-tui" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1"
toml_edit = "0.25"
ulid = { version = "1", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
libc = "0.2"
tracing = "0.1"
futures-util = "0.3"
portable-pty = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"
