[workspace]
resolver = "3"
# 역할별 crate(결정 13). 의존 규칙은 crates/aaa/tests/deps.rs가 검사한다.
members = [
    "crates/aaa-proto",
    "crates/aaa-config",
    "crates/aaa-common",
    "crates/aaa-vt",
    "crates/aaa-doctor",
    "crates/aaa-session",
    "crates/aaa-agent",
    "crates/aaa-host",
    "crates/aaa-tui",
    "crates/aaa",
]
# 들여온 vt100(글자 폭을 웹과 같게 고친 판, vendor/vt100/README.md). workspace 시험·lint 대상이 아니다
exclude = ["vendor/vt100"]
default-members = [
    "crates/aaa-proto",
    "crates/aaa-config",
    "crates/aaa-common",
    "crates/aaa-vt",
    "crates/aaa-doctor",
    "crates/aaa-session",
    "crates/aaa-agent",
    "crates/aaa-host",
    "crates/aaa-tui",
    "crates/aaa",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
aaa-proto = { path = "crates/aaa-proto" }
aaa-config = { path = "crates/aaa-config" }
aaa-common = { path = "crates/aaa-common" }
aaa-vt = { path = "crates/aaa-vt" }
aaa-doctor = { path = "crates/aaa-doctor" }
aaa-session = { path = "crates/aaa-session" }
aaa-agent = { path = "crates/aaa-agent" }
aaa-host = { path = "crates/aaa-host" }
aaa-tui = { path = "crates/aaa-tui" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1"
regex = "1"
toml_edit = "0.25"
ulid = { version = "1", features = ["serde"] }
base64 = "0.22"
# Web Push(VAPID ES256·ECDH·HKDF·AES-GCM). rustls가 이미 쓰는 판이다
ring = "0.17"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
libc = "0.2"
tracing = "0.1"
futures-util = "0.3"
portable-pty = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
# 다른 기기 TUI의 WebSocket client(plan §6.2). axum `ws`가 이미 쓰는 판이고, TLS는 위 rustls로 직접 연다
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[profile.dev]
debug = "line-tables-only"

# `aaa update`가 실행 파일(디버그 빌드 100MB 넘음)을 sha256으로 비교한다: 최적화 없는 sha2는 한 번에 3초 걸렸다
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
debug = "line-tables-only"

# session host 화면이 웹과 같은 칸을 쓰도록 글자 폭을 고친 vt100(plan §8.167)
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
