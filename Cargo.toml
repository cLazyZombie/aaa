[workspace]
resolver = "3"
# 역할별 crate(결정 13). 의존 규칙은 crates/aaa/tests/deps.rs가 검사한다.
members = [
    "crates/aaa-proto",
    "crates/aaa-config",
    "crates/aaa-common",
    "crates/aaa-vt",
    "crates/aaa-doctor",
    "crates/aaa-session",
    "crates/aaa-agent",
    "crates/aaa-host",
    "crates/aaa-tui",
    "crates/aaa",
]
default-members = [
    "crates/aaa-proto",
    "crates/aaa-config",
    "crates/aaa-common",
    "crates/aaa-vt",
    "crates/aaa-doctor",
    "crates/aaa-session",
    "crates/aaa-agent",
    "crates/aaa-host",
    "crates/aaa-tui",
    "crates/aaa",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
aaa-proto = { path = "crates/aaa-proto" }
aaa-config = { path = "crates/aaa-config" }
aaa-common = { path = "crates/aaa-common" }
aaa-vt = { path = "crates/aaa-vt" }
aaa-doctor = { path = "crates/aaa-doctor" }
aaa-session = { path = "crates/aaa-session" }
aaa-agent = { path = "crates/aaa-agent" }
aaa-host = { path = "crates/aaa-host" }
aaa-tui = { path = "crates/aaa-tui" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1"
toml_edit = "0.25"
ulid = { version = "1", features = ["serde"] }
base64 = "0.22"
# Web Push(VAPID ES256·ECDH·HKDF·AES-GCM). rustls가 이미 쓰는 판이다
ring = "0.17"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
libc = "0.2"
tracing = "0.1"
futures-util = "0.3"
portable-pty = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"
